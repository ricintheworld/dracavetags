title: '<green><bold>称号商店</green>'
size: 54
inventory:
  - '框框框框头框框框框'
  - '称称称称称称称称称'
  - '称称称称称称称称称'
  - '称称称称称称称称称'
  - '称称称称称称称称称'
  - '上全金点币物资返下'
icons:
  称:
    material: NAME_TAG
    content: true
    display: '{tag_display}'
    lore:
      - '{price_label}'
      - '{permission_label}'
      - '<gold>点击查看购买详情'
    left:
      - 'buy {tag_id}'
  上:
    material: ARROW
    display: '<yellow>上一页'
    left:
      - 'page prev'
  下:
    material: ARROW
    display: '<yellow>下一页'
    left:
      - 'page next'
  全:
    material: CHEST
    display: '{active_f}<aqua>全部'
    left:
      - 'filter all'
  金:
    material: GOLD_INGOT
    display: '{active_f}<green>金币'
    left:
      - 'filter vault'
  点:
    material: LIGHT_BLUE_DYE
    display: '{active_f}<aqua>点券'
    left:
      - 'filter playerpoints'
  币:
    material: EMERALD
    display: '{active_f}<gold>称号币'
    left:
      - 'filter coin'
  物:
    material: DIAMOND
    display: '{active_f}<yellow>物品'
    left:
      - 'filter item'
  资:
    material: NETHER_STAR
    display: '<gold>我的资产'
  返:
    material: OAK_DOOR
    display: '<yellow>返回主菜单'
    left:
      - 'open main-menu'
  头:
    material: PLAYER_HEAD
    display: "{player_name}"
    lore:
      - "{player_tag_lore}"
      - "{player_balance}"


  框:
    material: GRAY_STAINED_GLASS_PANE
    display: ' '
