title: '<gradient:#00EEFF:#EEFF00:#EE00FF><bold>称号仓库</gradient>'
size: 54
inventory:
  - '框框框框头框框框框'
  - '称称称称称称称称称'
  - '称称称称称称称称称'
  - '称称称称称称称称称'
  - '称称称称称称称称称'
  - '上数仓商自页榜返下'
icons:
  称:
    material: NAME_TAG
    content: true
    display: '{tag_display}'
    lore:
      - '{equipped_label}'
      - '{action_label}'
    left:
      - 'wear {tag_id}'
    right:
      - 'wear {tag_id}'
  上:
    material: ARROW
    display: '<yellow>上一页'
    left:
      - 'page prev'
  下:
    material: ARROW
    display: '<yellow>下一页'
    left:
      - 'page next'
  页:
    material: PAPER
    display: '<aqua>第 {page}/{pages} 页'
  数:
    material: BOOK
    display: '<aqua>我的称号：<white>{count}'
  仓:
    material: CHEST
    display: '<aqua>称号仓库'
    left:
      - 'open vault'
  自:
    material: ANVIL
    display: '<light_purple>自定义称号'
    left:
      - 'open custom'
  返:
    material: OAK_DOOR
    display: '<yellow>返回主菜单'
    left:
      - 'open main-menu'
  头:
    material: PLAYER_HEAD
    display: "{player_name}"
    lore:
      - "{player_tag_lore}"
      - "{player_balance}"

  榜:
    material: LADDER
    display: '<gold>排行'
    left:
      - 'open ranking'
  商:
    material: EMERALD
    display: '<green>称号商店'
    left:
      - 'open shop'

  框:
    material: GRAY_STAINED_GLASS_PANE
    display: ' '
