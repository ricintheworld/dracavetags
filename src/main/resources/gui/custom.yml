title: '<light_purple><bold>自定义称号</bold></light_purple>'
size: 54
inventory:
  - '框框框框头框框框框'
  - '称称称称称称称称称'
  - '称称称称称称称称称'
  - '称称称称称称称称称'
  - '称称称称称称称称称'
  - '额空上仓商返下空创'
icons:
  称:
    material: NAME_TAG
    content: true
    display: '{tag_display}'
    lore:
      - '<yellow>左键编辑'
      - '<red>右键删除'
    left:
      - 'edit-custom {tag_id}'
    right:
      - 'delete-custom {tag_id}'
  上:
    material: ARROW
    display: '<yellow>上一页'
    left:
      - 'page prev'
  下:
    material: ARROW
    display: '<yellow>下一页'
    left:
      - 'page next'
  额:
    material: PAPER
    display: '<gray>自定义额度：<white>{used}/{limit}'
  仓:
    material: CHEST
    display: '<aqua>称号仓库'
    left:
      - 'open vault'
  创:
    material: WRITABLE_BOOK
    display: '<green>创建自定义称号'
    left:
      - 'create-custom'
  自:
    material: ANVIL
    display: '<light_purple>自定义称号'
    left:
      - 'open custom'
  商:
    material: EMERALD
    display: '<green>称号商店'
    left:
      - 'open shop'
  返:
    material: OAK_DOOR
    display: '<yellow>返回主菜单'
    left:
      - 'open main-menu'
  头:
    material: PLAYER_HEAD
    display: "{player_name}"
    lore:
      - "{player_tag_lore}"
      - "{player_balance}"


  框:
    material: GRAY_STAINED_GLASS_PANE
    display: ' '
