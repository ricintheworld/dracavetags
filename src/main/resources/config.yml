lang: zh_cn

chat:
  # 玩家未装备称号时显示的默认文本（空 = 不显示，支持 MiniMessage）
  enabled: true
  # 管理面板创建称号时的默认文本（支持 MiniMessage 渐变）
  default-title: "[旅行者]"
  create-title: "[新建称号]"
  # {title}=称号 {player}=玩家名
  format: "{title}{player} »"

chat-color:
  default-mode: TITLE
  title-color-source: first
  trchat-native: true

shop:
  # 购买后自动穿戴
  enabled: true
  auto-equip: true
  currencies:
    vault:
      display: "<green>金币</green>"
    playerpoints:
      display: "<aqua>点券</aqua>"
    coin:
      display: "<gold>称号币</gold>"
    item:
      display: "<yellow>物品</yellow>"

database:
  # SQLITE | MYSQL（默认 SQLITE）
  type: SQLITE
  # 定时拉取在线玩家穿戴状态（游戏刻），跨服切服跟随
  sync-interval-ticks: 200
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "minecraft"
    user: "root"
    password: ""
    params: "?useSSL=false&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    table-prefix: "dracavetags_"
    pool-size: 4
  sqlite:
    file: "data.db"

interface:
  purchase-confirm:
    title: "<gold>确认购买称号</gold>"
    size: 27
    title-slot: 13
    confirm-slot: 11
    cancel-slot: 15
    confirm-material: LIME_CONCRETE
    cancel-material: RED_CONCRETE
  sounds:
    open: BLOCK_NOTE_BLOCK_PLING
    click: UI_BUTTON_CLICK
    switch-page: BLOCK_NOTE_BLOCK_BASS
    success: ENTITY_PLAYER_LEVELUP
    error: BLOCK_NOTE_BLOCK_BASS
    delete: BLOCK_NOTE_BLOCK_BASEDRUM

display:
  toggles-cooldown: 3

animation:
  # 默认动画周期（游戏刻，40=2秒）
  default-period-ticks: 40
  # 帧动画步进间隔（游戏刻）
  frame-step-ticks: 2
  # 渐变每步跨过几个字符
  gradient-char-step: 1

custom:
  #玩家自定义称号总开关
  enabled: true
  # 创建花费（玩家创建自定义称号时是否扣费）
  creation-cost:
    # 玩家自定义创建称号扣费 true 开启，false 跳过扣费
    enabled: true
    # 货币类型：vault（金币）| coin（称号币）| playerpoints（点券）
    type: vault
    # 金额（>0 生效，=0 等价于 enabled: false）
    amount: 1000
  # 删除花费
  delete-cost:
    enabled: false
    type: vault
    amount: 1000

  text:
    max-length: 16
  dynamic:
    min-period-ticks: 5
    max-period-ticks: 200
    max-colors: 5
    max-text-frames: 10
  filter:
    blocked-words: []