title: '<red>称号管理</red>'
size: 54
inventory:
  - '称称称称称称称称称'
  - '称称称称称称称称称'
  - '称称称称称称称称称'
  - '称称称称称称称称称'
  - '称称称称称称称称称'
  - '上空空传创检空返下'
icons:
  称:
    material: NAME_TAG
    content: true
    display: '{tag_display}'
    lore:
      - '{price_label}'
      - '<yellow>点击编辑'
      - '<red>Shift+点击删除'
    left:
      - 'edit {tag_id}'
    shift-left:
      - 'delete {tag_id}'
  上:
    material: ARROW
    display: '<yellow>上一页'
    left:
      - 'page prev'
  下:
    material: ARROW
    display: '<yellow>下一页'
    left:
      - 'page next'
  传:
    material: WRITABLE_BOOK
    display: '<gold>上传 tags.yml'
    left:
      - 'command dctags upload all'
  创:
    material: RAW_GOLD
    display: '<green>创建新称号'
    lore:
      - '<gray>创建一个空白称号'
      - '<gray>并打开管理面板'
    left:
      - 'create'
  检:
    material: BOOK
    display: '<gray>校验 tags.yml'
    left:
      - 'command dctags upload all --check'
  返:
    material: OAK_DOOR
    display: '<yellow>返回主菜单'
    left:
      - 'open main-menu'
